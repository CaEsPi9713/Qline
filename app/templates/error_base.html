{# UI-06 · Base de páginas de error. Sin trazas ni detalles internos. #}
{% extends "base_publico.html" %}
{% block titulo %}{{ codigo }} · {{ titulo }}{% endblock %}
{% block contenido %}
<div class="contenedor error-pagina">
  <p class="error-pagina__codigo" aria-hidden="true">{{ codigo }}</p>
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <div class="fila" style="justify-content:center">
    <a class="boton" href="/">Volver al inicio</a>
    <a class="boton boton--contorno" href="/consultar">Consultar un turno</a>
  </div>
</div>
{% endblock %}
