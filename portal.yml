# Antes de entregar: `python -m scripts.verificar_entrega` indica qué datos siguen pendientes.

nombre: QLine
resumen: Gestión de filas y turnos en tiempo real, con cola de prioridad en Redis e historial e indicadores en MongoDB
problema: En las oficinas con atención al público nadie sabe cuánto va a esperar, la prioridad depende de la buena voluntad de quien atiende y no queda registro de cuánto tardó cada atención
usuarios: Clientes, operadores, supervisores y administradores de una oficina con atención al público (institución, PYME o municipio)
motores: [Redis, MongoDB]
lenguaje: Python
licencia: MIT
repositorio: https://github.com/CaEsPi9713/Qline
demo_video: https://youtu.be/kZH0j2MF300
demo_url: https://grupo2.crnube.net/proyecto/qline/
