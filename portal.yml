  licencia: "LICENSE"
  changelog: "CHANGELOG.md"
  plan_maestro: "docs/Plan de Desarrollo QLINE/PLAN_DESARROLLO_QLINE.md"
  plan_s4: "docs/Plan de Desarrollo QLINE/PLAN_ALTERNATIVO_S4_QLINE.md"
  seguimiento_s4: "docs/seguimientos/S4.md"
